<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"event":"fixture"}}}</script>
<style>
  body { margin: 0; font-family: sans-serif; }
  #content { padding: 8px; }
  #box {
    width: 40px;
    height: 40px;
    background: #d33;
    animation: slide 0.6s linear infinite alternate;
  }
  @keyframes slide {
    from { transform: translateX(0); }
    to { transform: translateX(240px); }
  }
</style>
<script>
  window.renderReady = false;
  window.__CONFIG__ = { api: { baseUrl: "/api" }, feature: true };
  document.addEventListener('DOMContentLoaded', function() {
    const div = document.getElementById('content');
    const box = document.createElement('div');
    box.id = 'box';
    div.appendChild(box);

    // Keep the page visually active to ensure Playwright video recording produces frames reliably.
    const counter = document.createElement('div');
    counter.id = 'counter';
    div.appendChild(counter);
    let tick = 0;
    function frame() {
      counter.textContent = 'tick ' + tick++;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    setTimeout(function() {
      const loaded = document.createElement('p');
      loaded.id = 'loaded';
      loaded.textContent = 'Dynamic Content';
      div.appendChild(loaded);
      window.renderReady = true;
    }, 50);
    fetch("/api/details", { method: "POST" });
  });
</script>
</head>
<body>
  <button id="show-details" onclick="document.getElementById('details').textContent = 'Clicked Details';">Show details</button>
  <form id="checkout" method="post" action="/checkout">
    <input type="hidden" name="csrf" value="abc123" />
  </form>
  <p id="details"></p>
  <div id="content"></div>
</body>
</html>
