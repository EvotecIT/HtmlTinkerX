# .NET Testing Workflow
name: Test .NET

on:
  push:
    branches:
      - v1-legacy
      - v2-speedygonzales
    paths-ignore:
      - '*.md'
      - 'Docs/**'
      - 'Examples/**'
      - '.gitignore'
  pull_request:
    branches:
      - v1-legacy
      - v2-speedygonzales
  workflow_dispatch:

env:
  DOTNET_VERSION: |
    8.x
    10.x
  BUILD_CONFIGURATION: 'Release'
  TEST_VERBOSITY: minimal # set to 'detailed' to restore full test output
  SUMMARIZE_FAILURES: true # set to 'false' to disable summarizing failing tests
  DEBUG: 'pw:api,pw:browser,pw:protocol,pw:proxy,pw:channel:send,pw:channel:recv'

jobs:
  test-windows:
    name: 'Windows'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0, net472]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup .NET Framework
        if: matrix.framework == 'net472'
        uses: microsoft/setup-msbuild@v3

      - name: Restore dependencies
        run: dotnet restore Sources/HtmlTinkerX.sln

      - name: Build test project for the selected framework
        run: dotnet build Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework ${{ matrix.framework }} --no-restore

      - name: Run tests for net8.0
        if: matrix.framework == 'net8.0'
        run: dotnet test Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --framework net8.0 --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage" --blame-hang-timeout 2m --blame-hang-dump-type none --diag TestResults/vstest-net8.log
        timeout-minutes: 20

      - name: Run tests for net10.0
        if: matrix.framework == 'net10.0'
        run: dotnet test Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --framework net10.0 --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --blame-hang-timeout 2m --blame-hang-dump-type none --diag TestResults/vstest-net10.log
        timeout-minutes: 20

      - name: Run tests for net472
        if: matrix.framework == 'net472'
        run: dotnet test Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --framework net472 --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --blame-hang-timeout 2m --blame-hang-dump-type none --diag TestResults/vstest-net472.log
        timeout-minutes: 20

      - name: Summarize failing tests
        if: failure() && env.SUMMARIZE_FAILURES == 'true'
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Recurse -Filter *.trx
          if ($trxFiles.Count -eq 0) {
            Write-Host "No TRX files found for failure analysis"
            exit 0
          }

          Write-Host "=== Failed Tests Summary ==="
          $failureCount = 0

          $trxFiles | ForEach-Object {
            try {
              Select-Xml -Path $_.FullName -XPath "//*[local-name()='UnitTestResult'][@outcome='Failed']" |
                ForEach-Object {
                  $name = $_.Node.testName
                  $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                  Write-Host "❌ $name"
                  Write-Host "   $msg"
                  $failureCount++
                }
            } catch {
              Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
            }
          }

          if ($failureCount -eq 0) {
            Write-Host "No failed tests found in TRX files"
          } else {
            Write-Host "=== Total failed tests: $failureCount ==="
          }

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows-${{ matrix.framework }}
          path: |
            **/*.trx
            **/Sequence*.xml

      - name: Upload browser diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-diagnostics-windows-${{ matrix.framework }}
          path: TestResults/vstest-*.log
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports-windows-${{ matrix.framework }}
          path: '**/coverage.cobertura.xml'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: '**/coverage.cobertura.xml'

  test-ubuntu:
    name: 'Ubuntu'
    runs-on: ubuntu-latest
    env:
      HTMLTINKERX_PLAYWRIGHT_WITH_DEPS: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Sources/HtmlTinkerX.sln

      - name: Build modern test targets and examples
        run: |
          dotnet build Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0 --no-restore
          dotnet build Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net10.0 --no-restore
          dotnet build Sources/HtmlTinkerX.Examples/HtmlTinkerX.Examples.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Install Chromium runtime and Linux dependencies
        shell: pwsh
        run: |
          Import-Module ./Sources/PSParseHTML.PowerShell/bin/Release/net8.0/PSParseHTML.PowerShell.dll -ErrorAction Stop
          [HtmlTinkerX.HtmlBrowser]::EnsureInstalledAsync([HtmlTinkerX.HtmlBrowserEngine]::Chromium).GetAwaiter().GetResult()
        timeout-minutes: 20

      - name: Install Firefox runtime and Linux dependencies
        shell: pwsh
        run: |
          Import-Module ./Sources/PSParseHTML.PowerShell/bin/Release/net8.0/PSParseHTML.PowerShell.dll -ErrorAction Stop
          [HtmlTinkerX.HtmlBrowser]::EnsureInstalledAsync([HtmlTinkerX.HtmlBrowserEngine]::Firefox).GetAwaiter().GetResult()
        timeout-minutes: 20

      - name: Install WebKit runtime and Linux dependencies
        shell: pwsh
        run: |
          Import-Module ./Sources/PSParseHTML.PowerShell/bin/Release/net8.0/PSParseHTML.PowerShell.dll -ErrorAction Stop
          [HtmlTinkerX.HtmlBrowser]::EnsureInstalledAsync([HtmlTinkerX.HtmlBrowserEngine]::WebKit).GetAwaiter().GetResult()
        timeout-minutes: 20

      - name: Run tests
        run: dotnet test Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --framework net8.0 --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage" --blame-hang-timeout 2m --blame-hang-dump-type none --diag TestResults/vstest-net8.log
        timeout-minutes: 10

      - name: Run tests for net10.0
        run: dotnet test Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --framework net10.0 --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --blame-hang-timeout 2m --blame-hang-dump-type none --diag TestResults/vstest-net10.log
        timeout-minutes: 10

      - name: Summarize failing tests
        if: failure() && env.SUMMARIZE_FAILURES == 'true'
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Recurse -Filter *.trx
          if ($trxFiles.Count -eq 0) {
            Write-Host "No TRX files found for failure analysis"
            exit 0
          }

          Write-Host "=== Failed Tests Summary ==="
          $failureCount = 0

          $trxFiles | ForEach-Object {
            try {
              Select-Xml -Path $_.FullName -XPath "//*[local-name()='UnitTestResult'][@outcome='Failed']" |
                ForEach-Object {
                  $name = $_.Node.testName
                  $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                  Write-Host "❌ $name"
                  Write-Host "   $msg"
                  $failureCount++
                }
            } catch {
              Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
            }
          }

          if ($failureCount -eq 0) {
            Write-Host "No failed tests found in TRX files"
          } else {
            Write-Host "=== Total failed tests: $failureCount ==="
          }

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-ubuntu
          path: |
            **/*.trx
            **/Sequence*.xml

      - name: Upload browser diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-diagnostics-ubuntu
          path: TestResults/vstest-*.log
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: '**/coverage.cobertura.xml'

