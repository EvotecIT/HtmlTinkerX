# .NET Testing Workflow
name: Test .NET

on:
  push:
    branches:
      - v1-legacy
      - v2-speedygonzales
  pull_request:
  workflow_dispatch:

# Non-PR runs have unique groups, including while they are queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: |
    8.x
    10.x
  BUILD_CONFIGURATION: 'Release'
  TEST_VERBOSITY: minimal # set to 'detailed' to restore full test output
  SUMMARIZE_FAILURES: true # set to 'false' to disable summarizing failing tests
  DEBUG: 'pw:api,pw:browser,pw:protocol,pw:proxy'

jobs:
  changes:
    name: Select test coverage
    uses: ./.github/workflows/test-changes.yml

  test-windows:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Windows'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0, net472]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup .NET Framework
        if: matrix.framework == 'net472'
        uses: microsoft/setup-msbuild@v3

      - name: Restore dependencies
        run: dotnet restore Sources/HtmlTinkerX.sln

      - name: Build test project for the selected framework
        run: dotnet build Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework ${{ matrix.framework }} --no-restore

      - name: Run tests for ${{ matrix.framework }}
        shell: pwsh
        run: ./Build/Invoke-WindowsTests.ps1 -Framework '${{ matrix.framework }}' -Configuration '${{ env.BUILD_CONFIGURATION }}' -Verbosity '${{ env.TEST_VERBOSITY }}'
        timeout-minutes: 20

      - name: Summarize failing tests
        if: failure() && env.SUMMARIZE_FAILURES == 'true'
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Recurse -Filter *.trx
          if ($trxFiles.Count -eq 0) {
            Write-Host "No TRX files found for failure analysis"
            exit 0
          }

          Write-Host "=== Failed Tests Summary ==="
          $failureCount = 0

          $trxFiles | ForEach-Object {
            try {
              Select-Xml -Path $_.FullName -XPath "//*[local-name()='UnitTestResult'][@outcome='Failed']" |
                ForEach-Object {
                  $name = $_.Node.testName
                  $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                  Write-Host "❌ $name"
                  Write-Host "   $msg"
                  $failureCount++
                }
            } catch {
              Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
            }
          }

          if ($failureCount -eq 0) {
            Write-Host "No failed tests found in TRX files"
          } else {
            Write-Host "=== Total failed tests: $failureCount ==="
          }

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows-${{ matrix.framework }}
          path: |
            **/*.trx
            **/Sequence*.xml

      - name: Upload browser diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-diagnostics-windows-${{ matrix.framework }}
          path: |
            Sources/HtmlTinkerX.Tests/TestResults/browser-diagnostics/
            Sources/HtmlTinkerX.Tests/TestResults/**/*.dmp
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports-windows-${{ matrix.framework }}
          path: '**/coverage.cobertura.xml'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: Sources/HtmlTinkerX.Tests/TestResults

  test-ubuntu:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Ubuntu'
    runs-on: ubuntu-latest
    env:
      HTMLTINKERX_PLAYWRIGHT_WITH_DEPS: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Sources/HtmlTinkerX.sln

      - name: Build modern test targets and examples
        run: |
          dotnet build Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0 --no-restore
          dotnet build Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net10.0 --no-restore
          dotnet build Sources/HtmlTinkerX.Examples/HtmlTinkerX.Examples.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Install Chromium runtime and Linux dependencies
        shell: pwsh
        run: |
          Import-Module ./Sources/PSParseHTML.PowerShell/bin/Release/net8.0/PSParseHTML.PowerShell.dll -ErrorAction Stop
          [HtmlTinkerX.HtmlBrowser]::EnsureInstalledAsync([HtmlTinkerX.HtmlBrowserEngine]::Chromium).GetAwaiter().GetResult()
        timeout-minutes: 20

      - name: Install Firefox runtime and Linux dependencies
        shell: pwsh
        run: |
          Import-Module ./Sources/PSParseHTML.PowerShell/bin/Release/net8.0/PSParseHTML.PowerShell.dll -ErrorAction Stop
          [HtmlTinkerX.HtmlBrowser]::EnsureInstalledAsync([HtmlTinkerX.HtmlBrowserEngine]::Firefox).GetAwaiter().GetResult()
        timeout-minutes: 20

      - name: Permit sandbox user namespaces for installed Chromium binaries
        shell: bash
        run: bash Build/Configure-ChromiumCiSandbox.sh enable

      - name: Install WebKit runtime and Linux dependencies
        shell: pwsh
        run: |
          Import-Module ./Sources/PSParseHTML.PowerShell/bin/Release/net8.0/PSParseHTML.PowerShell.dll -ErrorAction Stop
          [HtmlTinkerX.HtmlBrowser]::EnsureInstalledAsync([HtmlTinkerX.HtmlBrowserEngine]::WebKit).GetAwaiter().GetResult()
        timeout-minutes: 20

      - name: Run tests
        run: dotnet test Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --framework net8.0 --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage" --blame-hang-timeout 2m --blame-hang-dump-type none --diag TestResults/vstest-net8.log
        timeout-minutes: 10

      - name: Run tests for net10.0
        run: dotnet test Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --framework net10.0 --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --blame-hang-timeout 2m --blame-hang-dump-type none --diag TestResults/vstest-net10.log
        timeout-minutes: 10

      - name: Remove job-scoped Chromium AppArmor profile
        if: always()
        shell: bash
        run: bash Build/Configure-ChromiumCiSandbox.sh cleanup

      - name: Summarize failing tests
        if: failure() && env.SUMMARIZE_FAILURES == 'true'
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Recurse -Filter *.trx
          if ($trxFiles.Count -eq 0) {
            Write-Host "No TRX files found for failure analysis"
            exit 0
          }

          Write-Host "=== Failed Tests Summary ==="
          $failureCount = 0

          $trxFiles | ForEach-Object {
            try {
              Select-Xml -Path $_.FullName -XPath "//*[local-name()='UnitTestResult'][@outcome='Failed']" |
                ForEach-Object {
                  $name = $_.Node.testName
                  $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                  Write-Host "❌ $name"
                  Write-Host "   $msg"
                  $failureCount++
                }
            } catch {
              Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
            }
          }

          if ($failureCount -eq 0) {
            Write-Host "No failed tests found in TRX files"
          } else {
            Write-Host "=== Total failed tests: $failureCount ==="
          }

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-ubuntu
          path: |
            **/*.trx
            **/Sequence*.xml

      - name: Upload browser diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-diagnostics-ubuntu
          path: TestResults/vstest-*.log
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: Sources/HtmlTinkerX.Tests/TestResults

  test-macos:
    needs: changes
    if: needs.changes.outputs.build == 'true' && github.event_name != 'pull_request'
    name: 'macOS'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Sources/HtmlTinkerX.sln

      - name: Build modern test targets and examples
        run: |
          dotnet build Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net8.0 --no-restore
          dotnet build Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net10.0 --no-restore
          dotnet build Sources/HtmlTinkerX.Examples/HtmlTinkerX.Examples.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --framework net8.0 --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage" --blame-hang-timeout 2m --blame-hang-dump-type none --diag TestResults/vstest-net8.log
        timeout-minutes: 30

      - name: Run tests for net10.0
        run: dotnet test Sources/HtmlTinkerX.Tests/HtmlTinkerX.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --framework net10.0 --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --blame-hang-timeout 2m --blame-hang-dump-type none --diag TestResults/vstest-net10.log
        timeout-minutes: 30

      - name: Summarize failing tests
        if: failure() && env.SUMMARIZE_FAILURES == 'true'
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Recurse -Filter *.trx
          if ($trxFiles.Count -eq 0) {
            Write-Host "No TRX files found for failure analysis"
            exit 0
          }

          Write-Host "=== Failed Tests Summary ==="
          $failureCount = 0

          $trxFiles | ForEach-Object {
            try {
              Select-Xml -Path $_.FullName -XPath "//*[local-name()='UnitTestResult'][@outcome='Failed']" |
                ForEach-Object {
                  $name = $_.Node.testName
                  $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                  Write-Host "❌ $name"
                  Write-Host "   $msg"
                  $failureCount++
                }
            } catch {
              Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
            }
          }

          if ($failureCount -eq 0) {
            Write-Host "No failed tests found in TRX files"
          } else {
            Write-Host "=== Total failed tests: $failureCount ==="
          }

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-macos
          path: |
            **/*.trx
            **/Sequence*.xml

      - name: Upload browser diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-diagnostics-macos
          path: TestResults/vstest-*.log
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: Sources/HtmlTinkerX.Tests/TestResults

  result:
    name: Test .NET result
    needs: [changes, test-windows, test-ubuntu, test-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check selected jobs
        shell: python
        env:
          JOBS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import json
          import os

          jobs = json.loads(os.environ['JOBS'])
          assert jobs['changes']['result'] == 'success', 'Coverage selection failed'
          build = jobs['changes']['outputs']['build']
          assert build in ('true', 'false'), 'Coverage selection returned no decision'
          for name, job in jobs.items():
              if name == 'changes':
                  continue
              skip = build == 'false' or (name == 'test-macos' and os.environ['EVENT_NAME'] == 'pull_request')
              expected = 'skipped' if skip else 'success'
              assert job['result'] == expected, f"{name}: expected {expected}, got {job['result']}"
          print('All selected jobs passed; documentation-only and PR macOS skips verified.')
