name: Test PowerShell (7)

# This workflow is disabled but ready for use
# To enable: change 'workflow_dispatch' to include 'push' and 'pull_request' triggers
# on:
#   workflow_dispatch:  # Manual trigger only
on:
  push:
    paths-ignore:
      - '*.md'
      - 'Docs/**'
      - 'Examples/**'
      - '.gitignore'
  pull_request:
    branches:
      - v2-speedygonzales

permissions:
  contents: read

env:
  DOTNET_VERSION: |
    8.x
    10.x
  BUILD_CONFIGURATION: 'Debug'

jobs:
  refresh-psd1:
    name: 'Refresh PSD1'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Install-Module -Name PSPublishModule -Repository PSGallery -Force -Scope CurrentUser -AllowClobber

      - name: Refresh module manifest
        shell: pwsh
        run: |
          .\Build\Build-Module.ps1 -RunMode Manifest

      - name: Report refreshed module entry files
        shell: pwsh
        run: |
          $generatedFiles = @(
            'PSParseHTML.psd1'
            'PSParseHTML.psm1'
            'PSParseHTML.Libraries.ps1'
          )
          $changes = git status --short -- $generatedFiles
          if ([string]::IsNullOrWhiteSpace($changes)) {
            "### Module entry files" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "No module entry file changes were produced by the refresh step." >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Warning "Module entry files changed during refresh. The test jobs will use the refreshed artifact, but CI will not push generated commits."
            "### Module entry files refreshed" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "One or more module entry files changed during the refresh step. Test jobs will use the refreshed artifact. Commit generated changes in the PR when the update is intentional." >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            '```diff' >> $env:GITHUB_STEP_SUMMARY
            git diff -- $generatedFiles >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload refreshed module entry files
        uses: actions/upload-artifact@v7
        with:
          name: module-entry
          path: |
            PSParseHTML.psd1
            PSParseHTML.psm1
            PSParseHTML.Libraries.ps1

  test-windows-ps7:
    needs: refresh-psd1
    name: 'Windows PowerShell 7'
    runs-on: windows-latest
    env:
      PSPARSEHTML_USE_DEVELOPMENT_BINARIES: 'true'
      PSPARSEHTML_DEVELOPMENT_CONFIGURATION: Debug
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Download refreshed module entry files
        uses: actions/download-artifact@v8
        with:
          name: module-entry
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build .NET solution
        run: |
          dotnet restore Sources/HtmlTinkerX.sln
          dotnet build Sources/HtmlTinkerX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: pwsh
        run: .\PSParseHTML.Tests.ps1
        timeout-minutes: 10

  test-windows-packaged-alc:
    needs: refresh-psd1
    name: 'Windows Packaged ALC conflict'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Download refreshed module entry files
        uses: actions/download-artifact@v8
        with:
          name: module-entry
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Install-Module -Name PSPublishModule -Repository PSGallery -Force -Scope CurrentUser -AllowClobber
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name TextMate -Repository PSGallery -RequiredVersion 0.2.1 -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PwshSpectreConsole -Repository PSGallery -RequiredVersion 2.6.3 -Force -SkipPublisherCheck -AllowClobber

      - name: Build packaged module
        shell: pwsh
        run: .\Build\Build-Module.ps1 -RunMode Build -SignModule:$false
        timeout-minutes: 15

      - name: Run packaged ALC conflict smoke test
        shell: pwsh
        run: |
          Import-Module Pester -Force
          $config = [PesterConfiguration]::Default
          $config.Run.Path = 'Tests/AssemblyLoadContext.Conflict.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
        timeout-minutes: 5

  test-ubuntu:
    needs: refresh-psd1
    name: 'Ubuntu PowerShell 7'
    runs-on: ubuntu-latest
    env:
      PSPARSEHTML_USE_DEVELOPMENT_BINARIES: 'true'
      PSPARSEHTML_DEVELOPMENT_CONFIGURATION: Debug
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Download refreshed module entry files
        uses: actions/download-artifact@v8
        with:
          name: module-entry
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/microsoft.list
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build .NET solution
        run: |
          dotnet restore Sources/HtmlTinkerX.sln
          dotnet build Sources/HtmlTinkerX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: pwsh
        run: ./PSParseHTML.Tests.ps1
        timeout-minutes: 10

  test-macos:
    needs: refresh-psd1
    name: 'macOS PowerShell 7'
    runs-on: macos-latest
    env:
      PSPARSEHTML_USE_DEVELOPMENT_BINARIES: 'true'
      PSPARSEHTML_DEVELOPMENT_CONFIGURATION: Debug
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Download refreshed module entry files
        uses: actions/download-artifact@v8
        with:
          name: module-entry
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Ensure PowerShell
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion'
          else
            brew update
            brew install powershell
          fi

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build .NET solution
        run: |
          dotnet restore Sources/HtmlTinkerX.sln
          dotnet build Sources/HtmlTinkerX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: pwsh
        run: ./PSParseHTML.Tests.ps1
        timeout-minutes: 10
