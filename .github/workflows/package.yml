name: Build & Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package module and library
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Install packaging tools
        shell: pwsh
        run: Install-Module PSPublishModule -Repository PSGallery -Scope CurrentUser -Force -AllowClobber

      - name: Build packages
        shell: pwsh
        run: .\Build\Build-Module.ps1 -RunMode Build -SignModule:$false
        timeout-minutes: 15

      - name: Upload module package
        uses: actions/upload-artifact@v7
        with:
          name: PSParseHTML-Module
          path: Artefacts/Packed/*.zip
          if-no-files-found: error

      - name: Upload library packages
        uses: actions/upload-artifact@v7
        with:
          name: HtmlTinkerX-NuGet
          path: Artefacts/ProjectBuild/**/*.nupkg
          if-no-files-found: error
