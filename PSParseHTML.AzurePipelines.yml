# Azure DevOps Pipeline for PSParseHTML (DISABLED - Using GitHub Actions)
# trigger: none  # Disabled - using GitHub Actions instead

# pr: none  # Disabled - using GitHub Actions instead
trigger:
  branches:
    include:
    - master
    - v2-speedygonzales
  paths:
    exclude:
    - README.md
    - CHANGELOG.md
    - Docs/*

pr:
  branches:
    include:
    - master
    - v2-speedygonzales

variables:
  buildConfiguration: 'Debug'
  dotNetVersion: '8.x'

stages:
# .NET Testing Stage - Core functionality testing
- stage: DotNetTests
  displayName: '.NET Build & Test'
  jobs:
  - job: DotNet_Windows
    displayName: '.NET Tests - Windows'
    pool:
      vmImage: 'windows-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK'
        inputs:
          packageType: 'sdk'
          version: $(dotNetVersion)

      - task: DotNetCoreCLI@2
        displayName: 'Restore .NET Dependencies'
        inputs:
          command: 'restore'
          projects: 'Sources/PSParseHTML.sln'

      - task: DotNetCoreCLI@2
        displayName: 'Build .NET Solution'
        inputs:
          command: 'build'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration) --no-restore'

      - task: DotNetCoreCLI@2
        displayName: 'Run .NET Tests'
        inputs:
          command: 'test'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration) --no-build --logger trx --collect:"XPlat Code Coverage"'

      - task: PublishTestResults@2
        displayName: 'Publish .NET Test Results'
        inputs:
          testResultsFormat: 'VSTest'
          testResultsFiles: '**/*.trx'
          mergeTestResults: true
        condition: succeededOrFailed()

  - job: DotNet_Ubuntu
    displayName: '.NET Tests - Ubuntu'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK'
        inputs:
          packageType: 'sdk'
          version: $(dotNetVersion)

      - task: DotNetCoreCLI@2
        displayName: 'Restore .NET Dependencies'
        inputs:
          command: 'restore'
          projects: 'Sources/PSParseHTML.sln'

      - task: DotNetCoreCLI@2
        displayName: 'Build .NET Solution'
        inputs:
          command: 'build'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration) --no-restore'

      - task: DotNetCoreCLI@2
        displayName: 'Run .NET Tests'
        inputs:
          command: 'test'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration) --no-build --logger trx'

  - job: DotNet_MacOS
    displayName: '.NET Tests - macOS'
    pool:
      vmImage: 'macos-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK'
        inputs:
          packageType: 'sdk'
          version: $(dotNetVersion)

      - task: DotNetCoreCLI@2
        displayName: 'Restore .NET Dependencies'
        inputs:
          command: 'restore'
          projects: 'Sources/PSParseHTML.sln'

      - task: DotNetCoreCLI@2
        displayName: 'Build .NET Solution'
        inputs:
          command: 'build'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration) --no-restore'

      - task: DotNetCoreCLI@2
        displayName: 'Run .NET Tests'
        inputs:
          command: 'test'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration) --no-build --logger trx'

# PowerShell Testing Stage - Module integration testing (independent of .NET stage)
- stage: PowerShellTests
  displayName: 'PowerShell Module Tests'
  # This stage runs independently - .NET tests can pass even if PowerShell tests fail
  condition: always()  # Run regardless of previous stage results
  jobs:
  - job: PowerShell_Windows_PS5
    displayName: 'PowerShell 5.1 - Windows'
    pool:
      vmImage: 'windows-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK'
        inputs:
          packageType: 'sdk'
          version: $(dotNetVersion)

      - task: DotNetCoreCLI@2
        displayName: 'Build .NET Solution'
        inputs:
          command: 'build'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration)'

      - powershell: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
        displayName: "Install Required PowerShell Modules"

      - powershell: |
          .\PSParseHTML.Tests.ps1
        displayName: "Run PowerShell Tests (PS 5.1)"

  - job: PowerShell_Windows_PS7
    displayName: 'PowerShell 7 - Windows'
    pool:
      vmImage: 'windows-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK'
        inputs:
          packageType: 'sdk'
          version: $(dotNetVersion)

      - task: DotNetCoreCLI@2
        displayName: 'Build .NET Solution'
        inputs:
          command: 'build'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration)'

      - pwsh: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
        displayName: "Install Required PowerShell Modules"

      - pwsh: |
          .\PSParseHTML.Tests.ps1
        displayName: "Run PowerShell Tests (PS 7)"
  - job: PowerShell_Ubuntu
    displayName: 'PowerShell 7 - Ubuntu'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK'
        inputs:
          packageType: 'sdk'
          version: $(dotNetVersion)

      - script: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/microsoft.list
          sudo apt-get update
          sudo apt-get install -y powershell
        displayName: "Install PowerShell Core"

      - task: DotNetCoreCLI@2
        displayName: 'Build .NET Solution'
        inputs:
          command: 'build'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration)'

      - task: PowerShell@2
        displayName: 'Install Required PowerShell Modules'
        inputs:
          targetType: 'inline'
          script: |
            Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
            Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
            Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - task: PowerShell@2
        displayName: 'Run PowerShell Tests'
        inputs:
          targetType: 'filePath'
          filePath: './PSParseHTML.Tests.ps1'

  - job: PowerShell_MacOS
    displayName: 'PowerShell 7 - macOS'
    pool:
      vmImage: 'macos-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK'
        inputs:
          packageType: 'sdk'
          version: $(dotNetVersion)

      - bash: |
          brew install --cask powershell
        displayName: "Install PowerShell 7"

      - task: DotNetCoreCLI@2
        displayName: 'Build .NET Solution'
        inputs:
          command: 'build'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration)'

      - task: PowerShell@2
        displayName: 'Install Required PowerShell Modules'
        inputs:
          targetType: 'inline'
          script: |
            Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
            Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
            Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - task: PowerShell@2
        displayName: 'Run PowerShell Tests'
        inputs:
          targetType: 'filePath'
          filePath: './PSParseHTML.Tests.ps1'

# Packaging Stage - Only runs if .NET tests pass (PowerShell tests can fail)
- stage: Package
  displayName: 'Package Libraries'
  dependsOn: DotNetTests  # Only depends on .NET tests, not PowerShell tests
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - job: Package
    displayName: 'Create Library Package'
    pool:
      vmImage: 'windows-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK'
        inputs:
          packageType: 'sdk'
          version: $(dotNetVersion)

      - task: DotNetCoreCLI@2
        displayName: 'Build Release'
        inputs:
          command: 'build'
          projects: 'Sources/PSParseHTML.sln'
          arguments: '--configuration $(buildConfiguration)'

      - powershell: |
          # Create libraries directory for .NET assemblies
          if (-not (Test-Path "Libraries")) {
              New-Item -Path "Libraries" -ItemType Directory -Force
          }

          # Copy built .NET assemblies to Libraries directory
          $SourcePath = "Sources\PSParseHTML\bin\Release"
          if (Test-Path $SourcePath) {
              Copy-Item -Path "$SourcePath\*" -Destination "Libraries" -Recurse -Force
              Write-Host "Copied .NET assemblies to Libraries directory"
          }

          # PowerShell module packaging would be handled separately by Manage-Module.ps1
          Write-Host "PowerShell module packaging should be done via Build/Manage-Module.ps1"
        displayName: "Copy .NET Libraries"

      - task: PublishBuildArtifacts@1
        displayName: 'Publish .NET Libraries'
        inputs:
          PathtoPublish: 'Libraries'
          ArtifactName: 'PSParseHTML-Libraries'
          publishLocation: 'Container'
